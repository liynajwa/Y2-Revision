<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revision Island</title>
<style>
/* ===== STYLES ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1fb6c9;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
#scroller{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#scroller::-webkit-scrollbar{display:none}
#map{display:block;width:100%;height:100%}
@media (max-aspect-ratio:10/7){#map{width:auto;min-width:100%}}
#map *{pointer-events:none}
.started #map .hit{pointer-events:all;cursor:pointer}
/* Animations */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1.6s ease-in-out infinite alternate}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.cloud{animation:drift 80s linear infinite}
.bird{animation:fly 22s linear infinite}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 6s ease-in-out infinite alternate}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.6s ease-in-out infinite}
.train{animation:train 9s ease-in-out infinite alternate}
.ring{fill:none;stroke:#fff;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
.started .ring{animation:pulse 3s ease-out infinite}
.spot{transform-box:fill-box;transform-origin:50% 100%;transition:transform .18s}
.spot:hover,.spot:focus-visible,.spot.on{transform:translateY(-8px) scale(1.07)}
.spot:focus-visible{outline:none}
.spot:focus-visible .ring{opacity:1;animation:none;stroke:#ffd23f}
.spot.tap{animation:tap .35s}
.lbl{opacity:0;transition:opacity .6s .3s}
.started .lbl{opacity:1}
@keyframes sway{to{transform:rotate(4deg)}}
@keyframes flag{to{transform:skewY(10deg) scaleX(.85)}}
@keyframes bob{to{transform:translateY(-7px)}}
@keyframes drift{from{transform:translateX(-250px)}to{transform:translateX(1250px)}}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(1100px)}}
@keyframes wave{to{transform:scale(1.025);opacity:.35}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes train{to{transform:translate(90px,45px)}}
@keyframes pulse{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
@keyframes tap{50%{transform:translateY(-4px) scale(.94)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Start screen */
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at center,rgba(255,255,255,.1),rgba(8,90,120,.45));transition:opacity .8s,visibility .8s;z-index:5}
.started #start{opacity:0;visibility:hidden}
#start h1{margin:0;font-size:clamp(34px,8vw,84px);line-height:1;color:#fff;letter-spacing:1px;text-shadow:0 4px 0 #e8590c,0 8px 0 #b8400a,0 14px 18px rgba(0,0,0,.3)}
#start p{margin:16px 0 26px;font-size:clamp(18px,3.4vw,30px);color:#fff;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.btn{font:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;color:#fff;background:linear-gradient(#ffb627,#ff8a00);box-shadow:0 6px 0 #c46500,0 10px 18px rgba(0,0,0,.3);padding:16px 38px;font-size:clamp(20px,3.5vw,30px);min-height:60px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c46500}
.btn:focus-visible,.ib:focus-visible{outline:4px solid #fff}
/* Corner buttons */
.ib{position:fixed;top:max(12px,env(safe-area-inset-top));width:56px;height:56px;border-radius:50%;border:0;background:#fff;font-size:26px;box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer;display:none;z-index:4}
.started .ib{display:block}
#home{left:12px}#snd{right:12px}
#hint{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:10px 18px;border-radius:999px;font-weight:700;color:#0a6a80;opacity:0;pointer-events:none;transition:opacity .6s;z-index:4;white-space:nowrap}
#hint.show{opacity:1}
/* Play card */
#card{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));width:min(92vw,430px);transform:translate(-50%,130%);transition:transform .3s;background:#fff;border-radius:26px;padding:18px 20px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center;z-index:6}
#card.open{transform:translate(-50%,0)}
#card h2{margin:0 36px 4px;font-size:26px;color:#0a6a80}
#card p{margin:0 0 14px;font-size:19px;color:#444}
#card .btn{width:100%;background:linear-gradient(#5fd35f,#2fa82f);box-shadow:0 6px 0 #1d7a1d;padding:12px}
#card .btn.soon{background:#cfd8dc;color:#455a64;box-shadow:0 6px 0 #90a4ae;cursor:default}
#x{position:absolute;top:8px;right:8px;width:46px;height:46px;border:0;border-radius:50%;background:#eceff1;font-size:22px;cursor:pointer}

/* ===== Train sentence game ===== */
#gm{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:linear-gradient(#aee6ff 0 38%,#8fe07a 38% 100%);overflow:auto;padding:max(10px,env(safe-area-inset-top)) 12px 16px}
#gm.open{display:flex}
.gh{display:flex;align-items:center;gap:10px;color:#0a6a80;font-size:clamp(20px,4vw,30px);font-weight:800}
.gh b{flex:1;text-align:center}
.ib2{width:56px;height:56px;border-radius:50%;border:0;background:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25)}
#gprog{display:flex;justify-content:center;gap:10px;margin:10px 0}
#gprog i{width:22px;height:22px;border-radius:50%;background:#fff;opacity:.6;border:3px solid #0a6a80}
#gprog i.cur{opacity:1;background:#ffd23f}#gprog i.done{opacity:1;background:#2fa82f}
.panel{width:min(100%,760px);margin:0 auto;background:rgba(255,255,255,.93);border-radius:26px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center}
#gmsg{margin:4px 0 12px;font-size:clamp(18px,3.4vw,24px);font-weight:700;color:#333;min-height:30px}
.tr{display:flex;align-items:flex-end;gap:6px;min-height:84px;padding-bottom:12px;border-bottom:8px dashed #8b5a2b}
.loco{font-size:54px;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:12px 8px;justify-content:center}
#ans{justify-content:flex-start;flex:1;gap:6px}
#pool{margin-top:18px;min-height:70px}
.car{position:relative;font:inherit;font-weight:800;font-size:clamp(20px,4.2vw,28px);color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.3);border:0;border-radius:12px;padding:10px 16px;min-height:56px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);margin-bottom:10px}
.car:active{transform:translateY(3px)}
.car:focus-visible{outline:4px solid #333}
.car::before,.car::after{content:"";position:absolute;bottom:-10px;width:14px;height:14px;border-radius:50%;background:#333;border:2px solid #aaa}
.car::before{left:12px}.car::after{right:12px}
#ans.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn.sm{font-size:22px;padding:10px 24px;min-height:52px}
.btn.blue{background:linear-gradient(#4cc9f0,#1c7ed6);box-shadow:0 6px 0 #145a9e}
.btn.green{background:linear-gradient(#5fd35f,#2fa82f);box-shadow:0 6px 0 #1d7a1d}
#gnext,#gend{display:none}
#gend h2{font-size:clamp(28px,6vw,44px);color:#0a6a80;margin:6px 0}
#gend p{font-size:28px;margin:6px 0 10px}

#gprog{flex-wrap:wrap}.panel+.panel{margin-top:12px}
.lt{font:inherit;font-weight:800;font-size:28px;color:#fff;width:56px;height:56px;border:0;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}.lt.used{opacity:.2;pointer-events:none}
.box{width:46px;height:56px;border:3px solid #0a6a80;border-radius:10px;background:#fff;font:inherit;font-weight:800;font-size:28px;color:#0a6a80;padding:0}
.gap{width:20px}#sb{margin-bottom:16px}#sb.shake{animation:shk .4s}
#sq{font-size:22px;font-weight:700;margin:0 0 8px}
#sart{width:min(100%,300px);aspect-ratio:300/220;margin:0 auto 12px;border-radius:16px;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);background:#fff}
#rtext{background:#fffbe6;border:3px solid #ffd23f;border-radius:16px;padding:12px;text-align:left;font-size:clamp(17px,3.2vw,22px);white-space:pre-wrap;max-height:34vh;overflow:auto;margin-bottom:10px}
#rq{font-size:clamp(20px,3.6vw,26px);font-weight:800;color:#0a6a80;margin:6px 0}
.opt{display:block;width:100%;font:inherit;font-weight:700;font-size:clamp(19px,3.6vw,25px);padding:12px 16px;margin:8px 0;border-radius:14px;border:3px solid #1c7ed6;background:#fff;color:#0a6a80;cursor:pointer;min-height:56px;text-align:left}
.opt.ok{background:#b8f2b8;border-color:#2fa82f}.opt.no{background:#ffd0d0;border-color:#e63946;opacity:.7}
#gmb .btn{display:block;width:100%;margin:10px 0}#gmq{font-size:24px;font-weight:800;color:#0a6a80;margin:4px 0 8px}

#prog{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#0a6a80;font-weight:800;font-size:18px;padding:12px 18px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.3);display:none;z-index:4;white-space:nowrap}
.started #prog{display:block}
#hint{top:calc(max(16px,env(safe-area-inset-top)) + 62px)}
.spot.fin .ring{stroke:#37e04a;stroke-width:7;opacity:1;animation:glow 2.6s ease-in-out infinite;filter:drop-shadow(0 0 6px #37e04a)}
.spot.fin:focus-visible .ring{stroke:#ffd23f}
@keyframes glow{50%{opacity:.5}}
.puff{animation:puff 1.6s ease-out infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(-8px,-18px) scale(1.5);opacity:0}}
.moving .rbob{animation:chug .22s linear infinite alternate}
@keyframes chug{to{transform:translateY(-2px)}}
#rider{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.choo{opacity:0;transition:opacity .2s}.moving .choo{opacity:1}
.moving .rbob{animation-duration:.16s}
.route{stroke:#fff3a0;stroke-width:7;stroke-dasharray:3 14;stroke-linecap:round;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
#rule{display:none;flex-wrap:wrap;gap:6px 4px;justify-content:center;align-items:center;margin-bottom:14px}
#rule i{font-style:normal;font-weight:800;color:#555;font-size:20px}
.chip{padding:6px 10px;border-radius:10px;font-weight:800;font-size:clamp(14px,2.8vw,18px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
#gnav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 0}
.nb{position:relative;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.25);padding:0}
.nb.cur{border-color:#ffd23f;background:#fff3a0}
.nb.fin::after{content:"✓";position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:#2fa82f;color:#fff;font-size:13px;line-height:20px;font-weight:800}
.nb:focus-visible{outline:4px solid #333}
#glevels{display:none}
</style>
</head>

  const im = `<image href="${a.src}" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" preserveAspectRatio="xMidYMid ${a.frame ? "slice" : "meet"}"${a.frame ? ` clip-path="url(#c_${k})"` : ""}/>`;

  return `<ellipse cy="6" rx="${a.w * .42}" ry="9" fill="#000" opacity=".18"/>` + (a.bob ? `<g class="bob">${im}</g>` : im);
};

  html(decor, `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)})"><ellipse rx="${r * 1.5}" ry="${r}" fill="#9a6b3c"/><ellipse cx="-3" cy="-4" rx="${r}" ry="${r * .6}" fill="#bf9460"/></g>`); }
for (let i = 0; i < 26; i++) { const a = i / 26 * 6.283 + .1, x = 500 + 385 * Math.cos(a), y = 402 + 200 * Math.sin(a); if (!far(x, y)) continue;
  html(decor, `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)})"><circle cx="-10" cy="2" r="13" fill="#3f9e48"/><circle cx="10" cy="3" r="12" fill="#4cb356"/><circle cy="-6" r="15" fill="#5cc85f"/></g>`); }

// Make each destination interactive: add big hit area, pulse ring, name sign
document.querySelectorAll(".spot[data-key]").forEach(g => {
  const key = g.dataset.key, game = GAMES[key];
  if (!game) { console.warn("No GAMES entry for", key); return; }
  if (ART[key]) g.insertAdjacentHTML("afterbegin", pic(key, ART[key]));
  g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
  g.setAttribute("aria-label", game.title + ". " + game.description);
  el("ellipse", { class: "ring", cx: 0, cy: 22, rx: 80, ry: 34 }, g);
  const w = game.title.length * 12 + 34, l = el("g", { class: "lbl", transform: "translate(0,62)" }, g);
  el("rect", { x: -w/2, y: -17, width: w, height: 34, rx: 17, fill: "#fff", stroke: "#0a6a80", "stroke-width": 3 }, l);
  const t = el("text", { "text-anchor": "middle", y: 6, "font-size": 19, "font-weight": 800, fill: "#0a6a80" }, l); t.textContent = game.title;
  el("circle", { class: "hit", cx: 0, cy: -35, r: 82, fill: "transparent" }, g);
  const act = () => select(key, g);
  g.addEventListener("click", act);
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
});

/* ============ 3. NAVIGATION LOGIC ============ */
function validUrl(u) {                         // returns a safe URL or null
  if (typeof u !== "string" || !u.trim() || /PASTE_|_HERE/i.test(u)) return null;
  try { const x = new URL(u.trim()); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (e) { return null; }
}
let current = null;
function openCard(key, g) {
  if (!document.body.classList.contains("started")) return;
  document.querySelectorAll(".spot.on").forEach(s => s.classList.remove("on"));
  g.classList.add("on"); g.classList.remove("tap"); void g.getBoundingClientRect(); g.classList.add("tap");
  const game = GAMES[key], ok = !!(game.sentences || game.levels || game.passages); current = ok ? key : null;
  $("ct").textContent = game.title;
  $("cd").textContent = ok ? game.description : "This adventure is coming soon!";
  const b = $("play"); b.textContent = ok ? "PLAY NOW" : "COMING SOON"; b.className = "btn" + (ok ? "" : " soon");
  $("card").classList.add("open"); chime();
}
function closeCard() { $("card").classList.remove("open"); document.querySelectorAll(".spot.on").forEach(s => s.classList.remove("on")); }
$("play").onclick = () => { if (current) startGame(current); };
$("x").onclick = closeCard;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeCard(); closeGame(); } });

// Start, reset view, portrait hint
const sc = $("scroller");
const centre = () => { sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2; };
addEventListener("load", centre); addEventListener("resize", centre);
$("go").onclick = () => {
  document.body.classList.add("started"); $("hint").classList.add("show");
  setTimeout(() => { const h = $("hint"); if (h) h.classList.remove("show"); }, 3500);
  if (sc.scrollWidth <= sc.clientWidth + 2) $("hint").remove();
};

/* ============ 4. SOUND (optional, off by default) ============ */
let ac, master, on = false;
function chime() {
  if (!on || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = 660; o.frequency.linearRampToValueAtTime(880, ac.currentTime + .12);
  g.gain.setValueAtTime(.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .3);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .32);
}
$("snd").onclick = () => {
  try {
    if (!ac) {                                   // gentle ocean-like noise, created only after a tap
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const n = ac.createBufferSource(), f = ac.createBiquadFilter(); master = ac.createGain();
      n.buffer = buf; n.loop = true; f.type = "lowpass"; f.frequency.value = 450; master.gain.value = 0;
      n.connect(f); f.connect(master); master.connect(ac.destination); n.start();
    }
    on = !on; master.gain.value = on ? .06 : 0; if (on && ac.state === "suspended") ac.resume();
    $("snd").textContent = on ? "🔊" : "🔇"; $("snd").setAttribute("aria-pressed", on);
  } catch (e) { console.warn("Sound unavailable", e); }
};

const SPEED = 320, REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = { sp: null, d: 0, x: 500, y: 425, raf: 0 }, PTH = {}, DONE = new Set(), TOTAL = Object.keys(GAMES).length;
for (const k in SPOKES) { PTH[k] = el("path", { d: SPOKES[k] }, $("rails")); PTH[k].len = PTH[k].getTotalLength(); }
const rider = $("rider"), flip = $("rflip");
function place(x, y) { rider.setAttribute("transform", "translate(" + x + "," + y + ") scale(1.6)"); if (Math.abs(x - T.x) > .05) flip.setAttribute("transform", x < T.x ? "scale(-1,1)" : "scale(1,1)"); T.x = x; T.y = y; }
function follow(x, k) { if (sc.scrollWidth > sc.clientWidth + 2) sc.scrollLeft = x * k - sc.clientWidth / 2; }
function goTo(key, done) {
  cancelAnimationFrame(T.raf); Object.values(PTH).forEach(p => p.classList.remove("route"));
  const legs = [], end = PTH[key] ? { sp: key, d: PTH[key].len } : { sp: null, d: 0 };
  if (T.sp && T.sp !== key) legs.push({ p: T.sp, a: T.d, b: 0 });
  if (PTH[key]) { const a = T.sp === key ? T.d : 0; if (a < PTH[key].len - 1) legs.push({ p: key, a, b: PTH[key].len }); }
  if (!legs.length) { done(); return; }
  const last = legs[legs.length - 1];
  if (REDUCE) { const q = PTH[last.p].getPointAtLength(last.b); place(q.x, q.y); T.sp = end.sp; T.d = end.d; done(); return; }
  legs.forEach(L => PTH[L.p].classList.add("route"));
  const k = $("map").getBoundingClientRect().width / 1000;
  let i = 0, d = legs[0].a, t0 = performance.now();
  document.body.classList.add("moving");
  const step = now => {
    let m = SPEED * Math.min(.05, (now - t0) / 1000); t0 = now;
    while (m > 0 && i < legs.length) {
      const L = legs[i], r = Math.abs(L.b - d);
      if (m >= r) { m -= r; d = L.b; i++; if (i < legs.length) d = legs[i].a; }
      else { d += (L.b > L.a ? 1 : -1) * m; m = 0; }
    }
    const L = legs[Math.min(i, legs.length - 1)], dd = i >= legs.length ? L.b : d, q = PTH[L.p].getPointAtLength(dd);
    place(q.x, q.y); follow(q.x, k);
    if (i >= legs.length) { T.sp = end.sp; T.d = end.d; document.body.classList.remove("moving"); Object.values(PTH).forEach(p => p.classList.remove("route")); done(); return; }
    T.sp = L.p; T.d = dd; T.raf = requestAnimationFrame(step);
  };
  T.raf = requestAnimationFrame(step);
}
function select(key, g) {
  if (!document.body.classList.contains("started")) return;
  closeCard(); document.querySelectorAll(".spot.on").forEach(s => s.classList.remove("on"));
  goTo(key, () => openCard(key, g));
}
function markDone(key) {
  DONE.add(key); const g = document.querySelector('.spot[data-key="' + key + '"]'); if (g) g.classList.add("fin");
  $("prog").textContent = DONE.size >= TOTAL ? "🎉 All stations complete!" : "✅ " + DONE.size + " / " + TOTAL + " stations";
}
$("prog").textContent = "✅ 0 / " + TOTAL + " stations";
</script>
</body>
